# A versão do formato do Docker Compose
name: app-projeto-backend

services:
  # 1º Serviço: Nosso Banco de Dados
  database:
    image: postgres:15-alpine
    container_name: meu_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: minha_api_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2º Serviço: Nossa API
  api:
    build: .
    container_name: minha_api_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASS=secretpassword
      - DB_NAME=minha_api_db
    depends_on:
      - database

# Declaração do volume para persistência de dados
volumes:
  postgres_data: